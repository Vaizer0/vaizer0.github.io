name: Deploy Truth Novel standalone site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: truthnovel-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate standalone page
        run: |
          set -e
          test -f index.html
          grep -q 'Truth Novel' index.html
          grep -q 'truthnovel.top' index.html
          grep -q 'gemini-3.6-flash' index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy standalone Truth Novel
        id: deployment
        uses: actions/deploy-pages@v4
